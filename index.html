<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSearch — Michał Plata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">
    
    <!-- Top Navigation Bar -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="https://placekwlb.github.io/" class="inline-flex items-center gap-2 text-sm font-medium text-zinc-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>Strona główna</span>
            </a>
            <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">CryptoSearch Live</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Wyszukiwarka Kryptowalut</h1>
            <p class="text-zinc-400 text-sm">Śledź kursy w czasie rzeczywistym z przeliczeniem na USD oraz PLN.</p>
        </div>

        <!-- Search Box -->
        <div class="relative mb-8">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input type="text" id="searchInput" placeholder="Szukaj kryptowaluty (np. Bitcoin, Ethereum, Solana)..." 
                class="w-full pl-11 pr-4 py-3 bg-zinc-900/80 border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm font-mono">
            
            <!-- Autocomplete Results Dropdown -->
            <div id="searchResults" class="absolute left-0 right-0 mt-2 bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl hidden z-50 max-h-64 overflow-y-auto divide-y divide-zinc-800/50"></div>
        </div>

        <!-- Watchlist / Active Coins Grid -->
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-zinc-400 font-mono">Obserwowane aktywa</h2>
            <span id="coinCount" class="text-xs text-zinc-500 font-mono">0 pozycji</span>
        </div>

        <div id="coinsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Cards Loaded Here -->
        </div>

        <div id="emptyState" class="text-center py-12 border border-dashed border-zinc-800 rounded-2xl hidden">
            <p class="text-zinc-500 text-sm">Brak obserwowanych kryptowalut. Wyszukaj coś powyżej, aby dodać do listy.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-600 font-mono">
        Michał Plata &copy; 2026 &bull; Dane dostarczane przez CoinGecko API
    </footer>

    <script>
        // Domyślne waluty startowe, jeśli lista w localStorage jest pusta
        let watchlist = JSON.parse(localStorage.getItem('cryptosearch_watchlist')) || ['bitcoin', 'ethereum', 'chainlink'];
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const coinsGrid = document.getElementById('coinsGrid');
        const emptyState = document.getElementById('emptyState');
        const coinCount = document.getElementById('coinCount');

        let searchTimeout = null;

        async function fetchCoinsData() {
            if (watchlist.length === 0) {
                coinsGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                coinCount.textContent = '0 pozycji';
                return;
            }
            emptyState.classList.add('hidden');
            coinCount.textContent = `${watchlist.length} pozycji`;

            try {
                const ids = watchlist.join(',');
                const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd,pln&include_24hr_change=true`);
                const data = await res.json();

                // Pobierz też detale (nazwy i ikony) dla kafelków
                const metaRes = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`);
                const metaData = await metaRes.json();

                renderGrid(metaData, data);
            } catch (err) {
                console.error('Błąd pobierania danych:', err);
            }
        }

        function renderGrid(metaList, priceData) {
            coinsGrid.innerHTML = '';
            metaList.forEach(coin => {
                const prices = priceData[coin.id] || { usd: 0, pln: 0, usd_24h_change: 0 };
                const change = prices.usd_24h_change || 0;
                const isPositive = change >= 0;

                const card = document.createElement('div');
                card.className = 'bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-5 flex flex-col justify-between hover:border-zinc-700 transition-all relative group';
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <img src="${coin.image}" alt="${coin.name}" class="w-9 h-9 rounded-full">
                            <div>
                                <h3 class="font-semibold text-zinc-100">${coin.name}</h3>
                                <span class="text-xs text-zinc-500 font-mono uppercase">${coin.symbol}</span>
                            </div>
                        </div>
                        <button onclick="removeCoin('${coin.id}')" class="text-zinc-600 hover:text-red-400 transition-colors p-1" title="Usuń z listy">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="space-y-1">
                        <div class="flex items-baseline justify-between">
                            <span class="text-xs text-zinc-500 font-mono">USD</span>
                            <span class="text-lg font-bold font-mono text-zinc-100">$${prices.usd.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 4})}</span>
                        </div>
                        <div class="flex items-baseline justify-between">
                            <span class="text-xs text-zinc-500 font-mono">PLN</span>
                            <span class="text-sm font-semibold font-mono text-zinc-300">${prices.pln.toLocaleString('pl-PL', {minimumFractionDigits: 2, maximumFractionDigits: 2})} zł</span>
                        </div>
                        <div class="pt-2 mt-2 border-t border-zinc-800/60 flex items-center justify-between text-xs font-mono">
                            <span class="text-zinc-500">Zmiana 24h</span>
                            <span class="${isPositive ? 'text-emerald-400' : 'text-red-400'} font-medium">
                                ${isPositive ? '+' : ''}${change.toFixed(2)}%
                            </span>
                        </div>
                    </div>
                `;
                coinsGrid.appendChild(card);
            });
        }

        // Wyszukiwanie w CoinGecko
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) {
                searchResults.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    const coins = data.coins.slice(0, 5); // top 5 wyników

                    if (coins.length === 0) {
                        searchResults.innerHTML = '<div class="p-3 text-xs text-zinc-500 text-center font-mono">Brak wyników</div>';
                    } else {
                        searchResults.innerHTML = coins.map(c => `
                            <div onclick="addCoin('${c.id}')" class="p-3 flex items-center justify-between hover:bg-zinc-800/70 cursor-pointer transition-colors">
                                <div class="flex items-center gap-3">
                                    <img src="${c.thumb}" class="w-6 h-6 rounded-full">
                                    <div>
                                        <span class="text-sm font-medium text-zinc-200">${c.name}</span>
                                        <span class="text-xs text-zinc-500 font-mono uppercase ml-2">${c.symbol}</span>
                                    </div>
                                </div>
                                <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded">Dodaj +</span>
                            </div>
                        `).join('');
                    }
                    searchResults.classList.remove('hidden');
                } catch (err) {
                    console.error('Błąd wyszukiwania:', err);
                }
            }, 300);
        });

        function addCoin(id) {
            if (!watchlist.includes(id)) {
                watchlist.push(id);
                localStorage.setItem('cryptosearch_watchlist', JSON.stringify(watchlist));
                fetchCoinsData();
            }
            searchInput.value = '';
            searchResults.classList.add('hidden');
        }

        function removeCoin(id) {
            watchlist = watchlist.filter(item => item !== id);
            localStorage.setItem('cryptosearch_watchlist', JSON.stringify(watchlist));
            fetchCoinsData();
        }

        // Ukrywanie listy po kliknięciu poza nią
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        // Start
        fetchCoinsData();
        // Odświeżaj co 60 sekund
        setInterval(fetchCoinsData, 60000);
    </script>
</body>
</html>
